<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fruit Farm</title>
<style>
  body { font-family: system-ui, sans-serif; background: #F5F7FA; color: #1F2937; padding: 40px; }
  .card { max-width: 520px; margin: 0 auto; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 8px; padding: 28px 32px; }
  h1 { font-size: 20px; margin-top: 0; }
  .controls { display: flex; gap: 14px; align-items: flex-end; margin-bottom: 18px; }
  .field label { display: block; font-size: 13px; color: #64748B; margin-bottom: 5px; }
  input[type=text] { width: 80px; box-sizing: border-box; padding: 9px 10px; border: 1px solid #E2E8F0; border-radius: 6px; font-size: 14px; }
  button { background: #3B6E8F; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; font-size: 14px; cursor: pointer; }
  button:hover { background: #2C5570; }
  #garden { line-height: 0; }
  #garden img { margin: 3px; border-radius: 6px; }
</style>
</head>
<body>
<div class="card">
  <h1>Fruit Farm</h1>
  <div class="controls">
    <div class="field">
      <label for="rows">Rows</label>
      <input type="text" id="rows" />
    </div>
    <div class="field">
      <label for="columns">Columns</label>
      <input type="text" id="columns" />
    </div>
    <button onclick="grow();">Plant Garden</button>
  </div>
  <div id="garden"></div>
</div>

<script>
function grow() {
  var rows = parseInt(document.getElementById("rows").value);
  var columns = parseInt(document.getElementById("columns").value);
  var arr = ["Orange.jpg", "Apple.jpg"];

  document.getElementById("garden").innerHTML = "";

  for (var r = 0; r < rows; r++) {
    for (var c = 0; c < columns; c++) {
      var number = Math.floor(Math.random() * arr.length);
      document.getElementById("garden").innerHTML +=
        "<img src='" + arr[number] + "' width='80px' height='80px'>";
    }
    document.getElementById("garden").innerHTML += "<br>";
  }
}
</script>
</body>
</html>
