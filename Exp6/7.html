<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Digital Clock</title>
<style>
  body { font-family: system-ui, sans-serif; background: #F5F7FA; color: #1F2937; padding: 40px; }
  .card { max-width: 380px; margin: 0 auto; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 8px; padding: 28px 32px; text-align: center; }
  h1 { font-size: 20px; margin-top: 0; }
  #time { font-size: 32px; font-weight: 700; color: #2C5570; }
</style>
</head>
<body>
<div class="card">
  <h1>Digital Clock</h1>
  <span id="time"></span>
</div>

<script>
function display() {
  var d = new Date();
  var h = d.getHours();
  var m = d.getMinutes();
  var s = d.getSeconds();

  if (h < 10) h = "0" + h;
  if (m < 10) m = "0" + m;
  if (s < 10) s = "0" + s;

  document.getElementById("time").innerHTML = h + ":" + m + ":" + s;
}

display();
setInterval(display, 1000);
</script>
</body>
</html>
