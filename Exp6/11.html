<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Records</title>
<style>
  body { font-family: system-ui, sans-serif; background: #F5F7FA; color: #1F2937; padding: 40px; }
  .card { max-width: 500px; margin: 0 auto; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 8px; padding: 28px 32px; }
  h1 { font-size: 20px; margin-top: 0; }
  h2 { font-size: 15px; color: #2C5570; margin: 18px 0 6px 0; }
  p { font-size: 14px; margin: 4px 0; }
</style>
</head>
<body>
<div class="card">
  <h1>Student Records</h1>
  <div id="list"></div>

  <h2>Born before 2000</h2>
  <div id="before2000"></div>

  <h2>Born in 2000 or after</h2>
  <div id="after2000"></div>
</div>

<script>
var students = [
  { name: "John", regno: "UR13CS129", year: 1995 },
  { name: "Joseph", regno: "UR13CS142", year: 1998 },
  { name: "Meera", regno: "UR13CS156", year: 2001 }
];

var listHtml = "";
var beforeHtml = "";
var afterHtml = "";

for (var i = 0; i < students.length; i++) {
  listHtml += "<p>" + students[i].name + "'s Register Number is " + students[i].regno + "</p>";

  if (students[i].year < 2000) {
    beforeHtml += "<p>" + students[i].name + "</p>";
  } else {
    afterHtml += "<p>" + students[i].name + "</p>";
  }
}

document.getElementById("list").innerHTML = listHtml;
document.getElementById("before2000").innerHTML = beforeHtml;
document.getElementById("after2000").innerHTML = afterHtml;
</script>
</body>
</html>
