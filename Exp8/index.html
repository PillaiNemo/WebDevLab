<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Workshop</title>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #1b1f27;
    margin: 0;
    padding: 30px 20px;
    display: flex;
    justify-content: center;
    color: #e5e9f0;
  }
  .workshop {
    background: #262c38;
    border-radius: 18px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    width: 520px;
    max-width: 100%;
    padding: 26px 30px 32px;
  }
  h1 {
    text-align: center;
    font-size: 22px;
    margin-bottom: 4px;
    letter-spacing: 1px;
  }
  .subtitle {
    text-align: center;
    color: #8b95a7;
    font-size: 13px;
    margin-bottom: 24px;
  }
  .stage {
    background: #1b1f27;
    border-radius: 14px;
    padding: 30px 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 26px;
  }
  .stage svg { width: 100%; max-width: 380px; height: auto; }
  .control-group { margin-bottom: 20px; }
  .control-group h3 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #8b95a7;
    margin-bottom: 10px;
  }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatch {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.15s, border-color 0.15s;
  }
  .swatch:hover { transform: scale(1.1); }
  .swatch.active { border-color: #fff; }
  .glass-swatch { width: 32px; height: 32px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; opacity: 0.85; }
  .glass-swatch:hover { transform: scale(1.1); }
  .glass-swatch.active { border-color: #fff; opacity: 1; }
  .slider-row { display: flex; align-items: center; gap: 14px; }
  input[type="range"] { flex: 1; accent-color: #4a90d9; }
  .slider-value { font-size: 13px; font-weight: 700; width: 40px; text-align: right; color: #4a90d9; }
</style>
</head>
<body>

<div class="workshop">
  <h1>Car Workshop</h1>
  <p class="subtitle">Customize your ride</p>

  <div class="stage">
    <svg viewBox="0 0 400 180" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="200" cy="155" rx="180" ry="10" fill="#000" opacity="0.35"/>
      <path id="carBody" d="M30,120 Q40,70 100,65 L140,45 Q160,35 230,35 L270,45 Q300,55 320,70 L370,80 Q385,90 375,115 L360,120 L320,120 Q315,100 290,100 Q265,100 260,120 L150,120 Q145,100 120,100 Q95,100 90,120 Z" fill="#c0392b" stroke="#111" stroke-width="2"/>
      <path id="carGlass" d="M148,62 L165,45 Q180,38 225,38 L255,46 Q272,55 285,68 Z" fill="#7fd1e0" opacity="0.85"/>
      <circle id="wheelFront" cx="290" cy="120" r="24" fill="#111"/>
      <circle cx="290" cy="120" r="10" fill="#888"/>
      <circle id="wheelBack" cx="120" cy="120" r="24" fill="#111"/>
      <circle cx="120" cy="120" r="10" fill="#888"/>
    </svg>
  </div>

  <div class="control-group">
    <h3>Change Body Color</h3>
    <div class="swatches">
      <div class="swatch active" style="background:#c0392b" data-color="#c0392b"></div>
      <div class="swatch" style="background:#2e6de0" data-color="#2e6de0"></div>
      <div class="swatch" style="background:#2ecc71" data-color="#2ecc71"></div>
      <div class="swatch" style="background:#f1c40f" data-color="#f1c40f"></div>
      <div class="swatch" style="background:#ecf0f1" data-color="#ecf0f1"></div>
      <div class="swatch" style="background:#1b1f27" data-color="#1b1f27"></div>
    </div>
  </div>

  <div class="control-group">
    <h3>Change Glass Tint</h3>
    <div class="swatches">
      <div class="glass-swatch active" style="background:#7fd1e0" data-tint="#7fd1e0"></div>
      <div class="glass-swatch" style="background:#3b3f47" data-tint="#3b3f47"></div>
      <div class="glass-swatch" style="background:#1a1c1f" data-tint="#1a1c1f"></div>
      <div class="glass-swatch" style="background:#a1e3d8" data-tint="#a1e3d8"></div>
    </div>
  </div>

  <div class="control-group">
    <h3>Change Tyre Size</h3>
    <div class="slider-row">
      <input type="range" id="tyreSize" min="16" max="32" value="24">
      <span class="slider-value" id="tyreSizeValue">24</span>
    </div>
  </div>
</div>

<script>
$(document).ready(function () {
  $('.swatch').click(function () {
    $('.swatch').removeClass('active');
    $(this).addClass('active');
    let color = $(this).data('color');
    $('#carBody').attr('fill', color);
  });

  $('.glass-swatch').click(function () {
    $('.glass-swatch').removeClass('active');
    $(this).addClass('active');
    let tint = $(this).data('tint');
    $('#carGlass').attr('fill', tint);
  });

  $('#tyreSize').on('input', function () {
    let size = parseInt($(this).val());
    $('#tyreSizeValue').text(size);
    $('#wheelFront, #wheelBack').attr('r', size);
  });
});
</script>

</body>
</html>
