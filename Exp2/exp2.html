<!DOCTYPE html>
<html>
<head>
<title>Ex No 2 - HTML5 Forms and Media Elements</title>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #eef3f7;
}
.container {
    width: 950px;
    margin: 0 auto;
    background-color: #ffffff;
    border: 1px solid #cccccc;
    padding: 15px;
}
.header {
    overflow: hidden;
    background-color: #fdf6ec;
    border-bottom: 2px solid #cfe0ef;
    padding: 10px;
    border-radius: 6px;
}
.header img {
    height: 130px;
    width: 130px;
    border-radius: 50%;
    float: left;
    border: 3px solid #ffffff;
}
.header h1 {
    font-family: "Times New Roman", serif;
    text-align: right;
    margin: 45px 20px 0 0;
    color: #34495e;
}
.nav {
    overflow: hidden;
    background-color: #eaf2f8;
    border-bottom: 1px solid #cfe0ef;
    padding: 10px 15px;
    border-radius: 6px;
    margin-top: 10px;
}
.nav .links { float: left; }
.nav .search { float: right; }
.nav .links a {
    margin-right: 40px;
    text-decoration: underline;
    color: #2e6da4;
}
.row {
    overflow: hidden;
    padding-top: 15px;
    display: flex;
    align-items: stretch;
    gap: 20px;
}
.col-left, .col-right {
    width: 50%;
    box-sizing: border-box;
}
.box {
    height: 100%;
    box-sizing: border-box;
    border: 1px solid #cfe0ef;
    border-radius: 6px;
    padding: 12px;
    background-color: #f7fbff;
}
.skills-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 0 25px;
}
.skill { width: 45%; }
.skill p {
    margin: 8px 0 2px 0;
    color: #34495e;
}
fieldset {
    border: 1px solid #cfe0ef;
    border-radius: 6px;
    padding: 10px;
    background-color: #f7fbff;
    height: 100%;
    box-sizing: border-box;
}
legend {
    color: #2e6da4;
    font-weight: bold;
}
.media-box, .box embed, .box iframe {
    display: block;
    width: 100%;
    height: 220px;
    border: none;
}
.footer {
    clear: both;
    text-align: left;
    background-color: #eaf2f8;
    border-top: 1px solid #cfe0ef;
    padding: 10px 15px;
    margin-top: 15px;
    border-radius: 6px;
    font-size: 13px;
    color: #34495e;
}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <img src="profilepic.jpg" alt="Profile Photo">
        <h1>Ms. Namrata Pillai</h1>
    </div>
    <div class="nav">
        <div class="links">
            <a href="#academics">Academics</a>
            <a href="#achievements">Achievements</a>
            <a href="#friends">Friends</a>
        </div>
        <div class="search">
            <input type="search" placeholder="search">
        </div>
    </div>
    <div class="row">
        <div class="col-left">
            <div class="box">
                <div class="skills-grid">
                    <div class="skill">
                        <p>Python:</p>
                        <progress value="75" max="100"></progress>
                    </div>
                    <div class="skill">
                        <p>Excel:</p>
                        <progress value="80" max="100"></progress>
                    </div>
                    <div class="skill">
                        <p>SQL:</p>
                        <progress value="70" max="100"></progress>
                    </div>
                    <div class="skill">
                        <p>HTML/CSS:</p>
                        <progress value="65" max="100"></progress>
                    </div>
                    <div class="skill">
                        <p>Java:</p>
                        <progress value="60" max="100"></progress>
                    </div>
                    <div class="skill">
                        <p>Power BI:</p>
                        <progress value="55" max="100"></progress>
                    </div>
                    <div class="skill">
                        <p>C++:</p>
                        <progress value="50" max="100"></progress>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-right">
            <div class="box">
                <video class="media-box" controls>
                    <source src="download.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-left">
            <fieldset>
                <legend>Personal Information</legend>
                <form>
                    <p><label>User name:</label> <input type="text" name="username" placeholder="Enter the user name" required></p>
                    <p><label>Password:</label> <input type="password" name="password" placeholder="Min length-10" minlength="10" required></p>
                    <p><label>Reg No:</label> <input type="text" name="regno" value="URK24CS1171"></p>
                    <p>
                        <label>Age:</label>
                        <select name="age">
                            <option value="19-24">19-24</option>
                            <option value="25-30">25-30</option>
                            <option value="31-35">31-35</option>
                        </select>
                    </p>
                    <p>
                        <label>Gender:</label>
                        <input type="radio" name="gender" value="male"> Male
                        <input type="radio" name="gender" value="female" checked> Female
                    </p>
                    <p><label>DOB:</label> <input type="date" name="dob" required></p>
                    <p><label>Favorite Color:</label> <input type="color" name="favcolor" value="#000000"></p>
                    <p><label>Change Profile Photo:</label> <input type="file" name="profilephoto"></p>
                </form>
            </fieldset>
        </div>
        <div class="col-right">
            <fieldset>
                <legend>Contact Information</legend>
                <form>
                    <p><label>Address:</label><br><textarea name="address" rows="3" cols="30">Kodaikanal, Tamil Nadu</textarea></p>
                    <p>
                        <label>State:</label>
                        <select name="state">
                            <option value="">Select</option>
                            <option value="TN" selected>Tamil Nadu</option>
                            <option value="KA">Karnataka</option>
                            <option value="KL">Kerala</option>
                        </select>
                    </p>
                    <p><label>Zipcode:</label> <input type="text" name="zipcode" pattern="[0-9]{6}" placeholder="only 6 numbers" required></p>
                    <p><label>Mobile:</label> <input type="tel" name="mobile" pattern="\+91[0-9]{10}" value="+917399257123" required></p>
                    <p><label>Email:</label> <input type="email" name="email" value="namrata123@gmail.com" required></p>
                    <p><label>URL:</label> <input type="url" name="website" placeholder="valid url" required></p>
                    <p><input type="checkbox" name="verified"> I verified</p>
                    <p><input type="submit" value="Submit"></p>
                </form>
            </fieldset>
        </div>
    </div>
    <div class="row">
        <div class="col-left">
            <div class="box">
                <embed class="media-box" src="Exp2Pdf.pdf" type="application/pdf">
            </div>
        </div>
        <div class="col-right">
            <div class="box">
                <iframe class="media-box"
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3917.3598134298004!2d76.7414860758472!3d10.936169256225291!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3ba866bd6aaaaaab%3A0xc650b8a75e7b51f0!2sKarunya%20Institute%20of%20Technology%20and%20Sciences%20(Deemed%20University)!5e0!3m2!1sen!2sin!4v1785504769541!5m2!1sen!2sin"
                    allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
        </div>
    </div>
    <div class="footer">
        <p>KODAIKANAL - KARUNYA INSTITUTE OF TECHNOLOGY AND SCIENCES</p>
        <p>2026-2027</p>
        <p>Web Tech Lab</p>
    </div>
</div>
</body>
</html>
